<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A descriptive title for visible word counting</title>
  <meta name="description" content="This fixture separates visible text from a hidden application payload so the browser innerText code path can be checked.">
</head>
<body>
  <main><h1>Visible words only.</h1></main>
  <div hidden>These hidden application words must not enter the browser visible word count.</div>
</body>
</html>
